# tmux-which-key menu (https://github.com/alexwforsythe/tmux-which-key).
# Opened with prefix-Space. tmux.conf symlinks this file into the plugin dir;
# the plugin rebuilds its menu from it on every tmux start (needs python3).
#
# Only prefix_table is bound. Never set root_table to C-Space: that is this
# setup's tmux prefix and the menu would swallow it.
#
# Popup entries mirror the direct prefix bindings in tmux.conf — keep the two
# in sync when changing a popup's command. No single quotes in commands: the
# plugin wraps each submenu in one single-quoted tmux string.
command_alias_start_index: 200
keybindings:
  prefix_table: Space
title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=green,align=centre,bold
position:
  x: R
  y: P
custom_variables:
  - name: log_info
    value: '#[fg=green,italics] [info]#[default]#[italics]'
macros:
  - name: reload-config
    commands:
      - source-file $HOME/.config/tmux/tmux.conf
      - display "#{log_info} Config reloaded"
  - name: restart-pane
    commands:
      - display "#{log_info} Restarting pane"
      - 'respawnp -k -c #{pane_current_path}'
items:
  - name: Run command
    key: space
    command: command-prompt
  - name: Last window
    key: tab
    command: last-window
  - name: Sessions (sessionx)
    key: o
    command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tmux-sessionx/scripts/sessionx.sh
  - separator: true
  - name: +Tools (popups)
    key: t
    menu:
      - name: lazygit          (prefix g)
        key: g
        command: 'display-popup -E -d "#{pane_current_path}" -w 90% -h 90% lazygit'
      - name: yazi             (prefix y)
        key: y
        command: 'display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "yazi-tmux-popup #{pane_id}"'
      - name: Scratch shell    (prefix `)
        key: '`'
        command: 'display-popup -E -d "#{pane_current_path}" -w 80% -h 80% "tmux new-session -A -s scratch \; set-option status off"'
      - name: btop             (prefix b)
        key: b
        command: display-popup -E -w 90% -h 90% btop
      - name: lazydocker       (prefix D)
        key: D
        command: 'display-popup -E -d "#{pane_current_path}" -w 90% -h 90% lazydocker'
      - name: Sqlit            (prefix S)
        key: S
        command: 'display-popup -E -d "#{pane_current_path}" -w 90% -h 90% sqlit'
      - name: numr calculator  (prefix N)
        key: N
        command: display-popup -E -w 70% -h 70% numr
      - name: Scrollback       (prefix e)
        key: e
        command: 'display-popup -E -w 90% -h 90% "~/.config/tmux/scrollback-popup.sh #{pane_id}"'
  - name: +Copy
    key: c
    menu:
      - name: Copy mode        (prefix [)
        key: c
        command: copy-mode
      - name: Hint copy        (prefix F)
        key: f
        command: run-shell -b $TMUX_PLUGIN_MANAGER_PATH/tmux-thumbs/tmux-thumbs.sh
      - name: Choose buffer
        key: b
        command: choose-buffer -Z
      - name: Paste buffer
        key: p
        command: pasteb
  - name: +Windows
    key: w
    menu:
      - name: Choose
        key: w
        command: choose-tree -Zw
      - name: Previous         (M-p)
        key: p
        command: previous-window
      - name: Next             (M-n)
        key: n
        command: next-window
      - name: New
        key: c
        command: 'neww -c #{pane_current_path}'
      - separator: true
      - name: Split right      (prefix %)
        key: '%'
        command: 'splitw -h -c #{pane_current_path}'
      - name: Split down       (prefix ")
        key: '"'
        command: 'splitw -v -c #{pane_current_path}'
      - name: +Layout
        key: l
        menu:
          - name: Next
            key: l
            command: nextl
            transient: true
          - name: Tiled
            key: t
            command: selectl tiled
          - name: Even horizontal
            key: h
            command: selectl even-horizontal
          - name: Even vertical
            key: v
            command: selectl even-vertical
          - name: Main horizontal
            key: H
            command: selectl main-horizontal
          - name: Main vertical
            key: V
            command: selectl main-vertical
      - name: Rotate
        key: o
        command: rotatew
        transient: true
      - separator: true
      - name: Rename
        key: R
        command: command-prompt -p "Rename window:" -I "#W" "renamew -- \"%%\""
      - name: Kill
        key: X
        command: 'confirm -p "Kill window #W? (y/n)" killw'
  - name: +Panes
    key: p
    menu:
      - name: Show numbers
        key: p
        command: displayp -d 0
      - name: Zoom             (prefix z)
        key: z
        command: resizep -Z
      - name: +Resize          (prefix HJKL)
        key: r
        menu:
          - name: Left
            key: h
            command: resizep -L 5
            transient: true
          - name: Down
            key: j
            command: resizep -D 5
            transient: true
          - name: Up
            key: k
            command: resizep -U 5
            transient: true
          - name: Right
            key: l
            command: resizep -R 5
            transient: true
      - name: Swap left
        key: H
        command: swapp -t "{left-of}"
      - name: Swap down
        key: J
        command: swapp -t "{down-of}"
      - name: Swap up
        key: K
        command: swapp -t "{up-of}"
      - name: Swap right
        key: L
        command: swapp -t "{right-of}"
      - name: Break to window
        key: '!'
        command: break-pane
      - separator: true
      - name: Respawn
        key: R
        macro: restart-pane
      - name: Kill
        key: X
        command: 'confirm -p "Kill pane #P? (y/n)" killp'
  - name: +Sessions
    key: s
    menu:
      - name: Choose tree
        key: s
        command: choose-tree -Zs
      - name: New
        key: N
        command: new
      - name: Rename
        key: r
        command: command-prompt -p "Rename session:" -I "#S" "rename-session -- \"%%\""
      - name: Detach
        key: d
        command: detach
  - name: +Plugins
    key: P
    menu:
      - name: Install          (prefix I)
        key: i
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/install_plugins
      - name: Update           (prefix U)
        key: u
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/update_plugins
      - name: Clean
        key: c
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/clean_plugins
  - separator: true
  - name: Reload config    (prefix r)
    key: r
    macro: reload-config
  - name: Messages
    key: '~'
    command: show-messages
  - name: All keys
    key: '?'
    command: list-keys -N
