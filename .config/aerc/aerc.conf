# aerc global config — TRACKED (no secrets here; account/auth live in accounts.conf).
# Overrides the bundled defaults at $PREFIX/share/aerc/aerc.conf.

[general]
# Default directory for :save (attachments). ~ expands to the home dir.
default-save-path = ~/Downloads

[ui]
# Catppuccin Mocha (matches Neovim). Styleset file lives in stylesets/ — aerc
# searches ~/.config/aerc/stylesets and $PREFIX/share/aerc/stylesets by name.
styleset-name        = catppuccin-mocha
# Folder list + message list layout
sidebar-width        = 22
empty-message        = (no messages)
mouse-enabled        = true
# Render the folder list as an indented tree instead of flat dotted names
# (INBOX.Archive shows as "Archive" nested under INBOX). Unread counts, from the
# default dirlist-right template, sit flush at the right edge.
dirlist-tree         = true
# Fuzzy-match folders and commands in tab-completion / the : prompt.
fuzzy-complete       = true
# Nerd Font pin glyph marking pinned tabs.
pinned-tab-marker    =
# Thread messages and keep the newest at the bottom
threading-enabled    = true
# Thread tree glyphs: rounded last-sibling corners plus a small arrow tip before
# each threaded message. Standalone (non-threaded) mail gets no prefix. ▸/▾ mark
# folded/unfolded threads.
thread-prefix-tip                  = "▸ "
thread-prefix-last-sibling         = "╰─"
thread-prefix-last-sibling-reverse = "╭─"
thread-prefix-folded               = "▸"
thread-prefix-unfolded             = "▾"
index-columns        = date<18,name<17,flags>4,subject<*
column-date          = {{.DateAutoFormat .Date.Local}}
# DateAutoFormat picks one of these by message age. Each includes a time so the
# message list shows times, not just dates. Layout uses Go's reference time
# (2006=year, 01=month, 02=day, 15:04=24h clock).
this-day-time-format  = 15:04
this-week-time-format = Mon 15:04
this-year-time-format = Jan 02 15:04
timestamp-format      = 2006 Jan 02 15:04
column-name          = {{index (.From | names) 0}}
column-flags         = {{.Flags | join ""}}
column-subject       = {{.ThreadPrefix}}{{.Subject}}

# Nerd Font glyphs for the flags column. icon-old is blank so already-read mail
# shows nothing (less clutter); unread/attachment/marked etc. stand out.
icon-new             = ●
icon-old             =
icon-replied         = ↩
icon-forwarded       = ↪
icon-flagged         = ★
icon-marked          = ✓
icon-deleted         = ✗
icon-draft           = ✎
icon-attachment      = 

[statusline]
# Bottom bar: account + current folder on the left, tray (threading/filter/
# search indicators) on the right, pending keystrokes centered. icon mode draws
# the tray state as glyphs instead of words; the softer separator ties it
# together. Uses the statusline_* colors from the styleset.
status-columns       = left<*,center:=,right>*
column-left          = [{{.Account}}]  {{.Folder}}  {{.StatusInfo}}
column-center        = {{.PendingKeys}}
column-right         = {{.TrayInfo}}
separator            = "  "
display-mode         = icon

[viewer]
pager                = less -R
# Prefer plain text part when a mail has both; fall back to html
alternatives         = text/plain,text/html

[compose]
# Use the same editor as $EDITOR
editor               = nvim
# Warn before sending if the body looks like it references an attachment
no-attachment-warning = ^[^>]*attach(ed|ment)
# Tab-complete recipients from the local address book (self-populates from
# incoming mail via the mail-received hook). %s is the search string.
address-book-cmd     = ~/.config/aerc/contacts query "%s"

[filters]
# Render plain text with light syntax coloring
text/plain           = colorize
text/calendar        = calendar
# Render HTML-only mail through the bundled w3m filter (network-isolated).
# Requires w3m on PATH (brew install w3m).
text/html            = ! html
# Optional: nicer diffs / patches
application/x-patch  = colorize

[hooks]
# On new mail: harvest the sender into the address book and pop a macOS
# notification (INBOX only). See ~/.config/aerc/hooks/mail-received.
mail-received = ~/.config/aerc/hooks/mail-received
