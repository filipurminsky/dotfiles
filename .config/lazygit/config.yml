gui:
  nerdFontsVersion: "3"

git:
  # Recent lazygit renamed `git.pagers` to `git.diffRenderers`, and the entry's
  # `pager` field to `command`; `delta` picks up the [delta] settings (Catppuccin
  # Mocha syntax theme) from ~/.gitconfig on top of these flags.
  diffRenderers:
    - type: stdinFilter
      colorArg: always
      command: delta --dark --paging=never --side-by-side --line-numbers
